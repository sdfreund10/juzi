<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e85d04" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="juzi" />
    <title>juzi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <style>
      /* First paint before JS/CSS modules load — mirrors .app / .brand */
      html,
      body {
        margin: 0;
        background: #ededea;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #1e2024;
      }
      #app {
        min-height: 100vh;
        min-height: 100dvh;
      }
:where(#app) .app {
        width: min(390px, 100%);
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0 auto;
        padding-top: env(safe-area-inset-top, 0px);
        background: #fafaf7;
        border-left: 1px solid #c9ccd2;
        border-right: 1px solid #c9ccd2;
      }
      @media (max-width: 390px) {
        #app .app {
          border-left: 0;
          border-right: 0;
        }
      }
      #app .masthead {
        padding: 12px 20px;
        border-bottom: 1px solid #d9dce0;
      }
      #app .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-size: 16px;
        font-weight: 600;
        line-height: 1;
        letter-spacing: -0.01em;
      }
      #app .brand-mark {
        display: block;
        width: 28px;
        height: 28px;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <main class="app">
        <header class="masthead">
          <p class="brand">
            <img
              class="brand-mark"
              src="/favicon.svg"
              alt=""
              width="28"
              height="28"
            />
            juzi
          </p>
        </header>
      </main>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
