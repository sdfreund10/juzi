name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  python:
    name: Python lint & test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: juzi
          POSTGRES_USER: juzi
          POSTGRES_PASSWORD: juzi
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U juzi -d juzi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-only-not-for-production
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://juzi:juzi@localhost:5432/juzi_development
      POSTGRES_TEST_DB: juzi_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version-file: ".python-version"

      - name: Install dependencies
        run: uv sync --locked --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Migration check
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Pytest
        run: uv run pytest

  frontend:
    name: Frontend test, typecheck & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Vitest
        run: npm test

      - name: Typecheck & build (PR)
        if: github.ref != 'refs/heads/main'
        run: npm run build

      - name: Build production release and upload Sentry maps
        if: github.ref == 'refs/heads/main'
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_UPLOAD: ${{ vars.VITE_SENTRY_DSN != '' && 'true' || 'false' }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: juzi-frontend
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: npm run build

      - name: Check production artifact contains no source maps
        run: |
          if find dist -name '*.map' -print -quit | read -r; then
            echo 'Source maps must not be included in the deploy artifact' >&2
            exit 1
          fi

      - name: Upload SPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  deploy:
    name: Deploy to droplet
    needs: [python, frontend]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Download SPA artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DROPLET_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "${{ secrets.DROPLET_HOST }}" >> ~/.ssh/known_hosts

      # Future: stage dist separately and swap after restart. With DEBUG=false,
      # WhiteNoise indexes at worker startup; rsync --delete here can 404 hashed
      # assets until gunicorn restarts (or leave a mismatch if deploy fails).
      - name: Sync SPA to droplet
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes" \
            frontend/dist/ \
            "${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }}:/var/www/juzi/frontend/dist/"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          script: |
            EXPECTED_RELEASE='${{ github.sha }}' bash /var/www/juzi/deploy/deploy.sh

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy