# Reverse proxy for juzi.
# Replace YOUR_DOMAIN with the production hostname before enabling.
# After DNS points here, run:
#   sudo certbot --nginx -d YOUR_DOMAIN
# certbot adds SSL to the YOUR_DOMAIN server. Leave the default servers
# in place. They are the fallback for every other Host.

upstream juzi_gunicorn {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Anything whose Host is not YOUR_DOMAIN, including the droplet IP.
# 444 closes the connection with no response. ssl_reject_handshake
# rejects TLS before a request exists and needs no certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    client_max_body_size 10M;

    location / {
        proxy_pass http://juzi_gunicorn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_redirect off;
    }
}
